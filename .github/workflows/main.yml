name: Extract and Commit Zip at Root

on:
  push:
    paths:
      - '*.zip' # Triggers when a zip file is pushed to the root, or adjust as needed
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  extract-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract zip file
        run: |
          # Find the first zip file in the root directory
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in root directory."
            exit 1
          fi

          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .

          echo "Removing archive: $ZIP_FILE"
          rm -f "$ZIP_FILE"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git status
          # Check if there are changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Extract root zip file and update repository contents"
            git push
          fi
          
